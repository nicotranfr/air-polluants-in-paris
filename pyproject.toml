[project]
name = "airparis"
version = "0.1.0"
description = "Forecasting hourly air pollution in Paris (X-HEC TS 2025 Kaggle challenge)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data
    "kagglehub>=0.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "holidays>=0.50",
    # viz
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # modelling
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "torch>=2.3",
    "chronos-forecasting>=2.0",
    # notebooks
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
    "ipywidgets>=8.1",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airparis"]

[tool.ruff]
line-length = 100
